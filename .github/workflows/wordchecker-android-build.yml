name: Build WordChecker Android APK

on:
  push:
    branches: [wordchecker-android-build]
    paths:
      - 'wordchecker-build/parts/**'
      - '.github/workflows/wordchecker-android-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Restore and verify WordChecker source
        shell: bash
        run: |
          echo 'ec81adbb12eb5e5a61fbf2d2c4fb258cbae631bf22a2f70a60bbbab1922b8972  wordchecker-build/parts/part00' | sha256sum -c -
          echo '6b5e814327fcc6ea95b6ef22225cf31fac69d8f2ac1ae3c3e2768da50d1eca52  wordchecker-build/parts/part01' | sha256sum -c -
          echo 'eb9c5efa2293306b94b8266cf40960b037e2c6d00e4ec4496af5f79d3d5554f6  wordchecker-build/parts/part02' | sha256sum -c -
          echo '6e74a8d6fcb9f39ca02f237325bf9405852b358150fd724be9f97f9380f23316  wordchecker-build/parts/part03' | sha256sum -c -
          echo 'ada5a4dcc5f7a5db529c4e8862b5e5c6bc3ae7cf7b99cf67b0999d57de01053c  wordchecker-build/parts/part04' | sha256sum -c -
          echo '6e517a0dd7fabec992b3fc85c172e40352fd95e7d904e3884aae43b7d76e7ea3  wordchecker-build/parts/part05' | sha256sum -c -
          mkdir -p build-src
          cat wordchecker-build/parts/part00 wordchecker-build/parts/part01 wordchecker-build/parts/part02 wordchecker-build/parts/part03 wordchecker-build/parts/part04 wordchecker-build/parts/part05 > build-src/project.zip.b64
          base64 -d build-src/project.zip.b64 > build-src/project.zip
          echo 'f939709d4c23b8c768c616541863945510356d1a81d25d707308ee0e35e1f480  build-src/project.zip' | sha256sum -c -
          unzip -q build-src/project.zip -d build-src
          sed -i 's/compileSdk = 37/compileSdk = 36/' build-src/WordChecker_Android/app/build.gradle.kts
          sed -i 's/targetSdk = 37/targetSdk = 36/' build-src/WordChecker_Android/app/build.gradle.kts

      - name: Unit tests
        working-directory: build-src/WordChecker_Android
        run: gradle --no-daemon testDebugUnitTest

      - name: Build debug APK
        working-directory: build-src/WordChecker_Android
        run: gradle --no-daemon assembleDebug

      - name: Collect APK
        run: |
          mkdir -p output
          cp build-src/WordChecker_Android/app/build/outputs/apk/debug/app-debug.apk output/WordChecker-0.1.0-debug.apk
          sha256sum output/WordChecker-0.1.0-debug.apk > output/WordChecker-0.1.0-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WordChecker-Android-APK
          path: output/
          if-no-files-found: error
