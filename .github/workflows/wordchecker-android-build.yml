name: Build WordChecker Android APK

on:
  push:
    branches: [wordchecker-android-build]
    paths:
      - 'wordchecker-v031-patch/**'
      - 'wordchecker-v032-patch/**'
      - 'wordchecker-v033-patch/**'
      - '.github/workflows/wordchecker-android-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Reconstruct v0.3.1 base
        shell: bash
        run: |
          set -euo pipefail
          cat wordchecker-v031-patch/parts/part00 wordchecker-v031-patch/parts/part01 wordchecker-v031-patch/parts/part02 wordchecker-v031-patch/parts/part03 > /tmp/wc031.patch.gz.b64
          base64 -d /tmp/wc031.patch.gz.b64 > /tmp/wc031.patch.gz
          gzip -dc /tmp/wc031.patch.gz > /tmp/wc031.patch
          cp -R wordchecker-v03-src build-v033
          sed -i 's/ScrollView\.LayoutParams/FrameLayout.LayoutParams/g' build-v033/app/src/main/java/com/cornelius/wordchecker/ime/WordCheckerImeService.kt
          awk '
            /^diff -ruN/ {
              skip = ($0 ~ /app\/build.gradle.kts/ || $0 ~ /SafeDeleteEngine.kt/ || $0 ~ /SpellTextEngine.kt/)
            }
            !skip { print }
          ' /tmp/wc031.patch > /tmp/wc031-filtered.patch
          cd build-v033
          patch -p4 < /tmp/wc031-filtered.patch
          cp ../wordchecker-v031-patch/exact/SafeDeleteEngine.kt app/src/main/java/com/cornelius/wordchecker/core/SafeDeleteEngine.kt
          cp ../wordchecker-v031-patch/exact/SpellTextEngine.kt app/src/main/java/com/cornelius/wordchecker/core/SpellTextEngine.kt
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/cornelius/wordchecker/ime/WordCheckerImeService.kt')
          lines = p.read_text().splitlines()
          found = 0
          for i, line in enumerate(lines):
              if 'to listOf' in line and '“' in line and '”' in line and '„' in line:
                  lines[i] = '            "\\\"" to listOf("\\\"", "“", "”", "„"),'
                  found += 1
          if found != 1:
              raise SystemExit(f'expected one quote-symbol entry, found {found}')
          p.write_text('\n'.join(lines) + '\n')
          PY
          sed -i 's/versionCode = 3/versionCode = 4/' app/build.gradle.kts
          sed -i 's/versionName = "0.3.0-prototype"/versionName = "0.3.1-prototype"/' app/build.gradle.kts

      - name: Apply v0.3.2 latency patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d wordchecker-v032-patch/wordchecker-v032.patch.gz.b64 > /tmp/wc032.patch.gz
          gzip -dc /tmp/wc032.patch.gz > /tmp/wc032.patch
          cd build-v033
          patch -p1 < /tmp/wc032.patch
          grep -q 'versionCode = 5' app/build.gradle.kts
          grep -q 'versionName = "0.3.2-prototype"' app/build.gradle.kts

      - name: Apply v0.3.3 single-surface speed patch
        shell: bash
        run: |
          set -euo pipefail
          echo 'dec539dcfaa0f4e6dc80518907b5b1aed7b8f3b7fcff055ff39b167b8fe0e79c  wordchecker-v033-patch/wordchecker-v033.patch.gz.b64' | sha256sum -c -
          base64 -d wordchecker-v033-patch/wordchecker-v033.patch.gz.b64 > /tmp/wc033.patch.gz
          gzip -dc /tmp/wc033.patch.gz > /tmp/wc033.patch
          echo '996f300b81b921592143d73359c86201d75d8c8129d24a93cf3ecd54d738b1da  /tmp/wc033.patch' | sha256sum -c -
          cd build-v033
          patch -p1 < /tmp/wc033.patch
          grep -q 'versionCode = 6' app/build.gradle.kts
          grep -q 'versionName = "0.3.3-speed-core"' app/build.gradle.kts
          test -f app/src/main/java/com/cornelius/wordchecker/ime/FastKeyboardSurface.kt
          grep -q 'SPEED_SURFACE = true' app/src/main/java/com/cornelius/wordchecker/ime/WordCheckerImeService.kt
          grep -q 'SPEED_DIAGNOSTIC = true' app/src/main/java/com/cornelius/wordchecker/ime/WordCheckerImeService.kt

      - name: Unit tests
        working-directory: build-v033
        run: gradle --no-daemon testDebugUnitTest

      - name: Build debug APK
        working-directory: build-v033
        run: gradle --no-daemon assembleDebug

      - name: Collect APK
        run: |
          mkdir -p output
          cp build-v033/app/build/outputs/apk/debug/app-debug.apk output/WordChecker-0.3.3-speed-core-debug.apk
          sha256sum output/WordChecker-0.3.3-speed-core-debug.apk > output/WordChecker-0.3.3-speed-core-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WordChecker-v0.3.3-Speed-Core-APK
          path: output/
          if-no-files-found: error
