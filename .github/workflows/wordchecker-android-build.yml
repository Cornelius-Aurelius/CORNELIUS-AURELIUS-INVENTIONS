name: Build WordChecker Android APK

on:
  push:
    branches: [wordchecker-android-build]
    paths:
      - 'wordchecker-build/parts/**'
      - '.github/workflows/wordchecker-android-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-37' 'build-tools;36.0.0'

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Restore and verify WordChecker source
        shell: bash
        run: |
          mkdir -p build-src
          cat wordchecker-build/parts/part00 wordchecker-build/parts/part01 wordchecker-build/parts/part02 wordchecker-build/parts/part03 wordchecker-build/parts/part04 wordchecker-build/parts/part05 > build-src/project.zip.b64
          base64 -d build-src/project.zip.b64 > build-src/project.zip
          echo 'f939709d4c23b8c768c616541863945510356d1a81d25d707308ee0e35e1f480  build-src/project.zip' | sha256sum -c -
          unzip -q build-src/project.zip -d build-src

      - name: Unit tests
        working-directory: build-src/WordChecker_Android
        run: gradle --no-daemon testDebugUnitTest

      - name: Build debug APK
        working-directory: build-src/WordChecker_Android
        run: gradle --no-daemon assembleDebug

      - name: Collect APK
        run: |
          mkdir -p output
          cp build-src/WordChecker_Android/app/build/outputs/apk/debug/app-debug.apk output/WordChecker-0.1.0-debug.apk
          sha256sum output/WordChecker-0.1.0-debug.apk > output/WordChecker-0.1.0-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WordChecker-Android-APK
          path: output/
          if-no-files-found: error
