name: Build WordChecker Android APK

on:
  push:
    branches: [wordchecker-android-build]
    paths:
      - 'wordchecker-src/**'
      - '.github/workflows/wordchecker-android-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Unit tests
        working-directory: wordchecker-src
        run: gradle --no-daemon testDebugUnitTest

      - name: Build debug APK
        working-directory: wordchecker-src
        run: gradle --no-daemon assembleDebug

      - name: Collect APK
        run: |
          mkdir -p output
          cp wordchecker-src/app/build/outputs/apk/debug/app-debug.apk output/WordChecker-0.1.0-debug.apk
          sha256sum output/WordChecker-0.1.0-debug.apk > output/WordChecker-0.1.0-debug.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WordChecker-Android-APK
          path: output/
          if-no-files-found: error
